<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Berry body -->
  <circle cx="256" cy="272" r="180" fill="#1a1a2e"/>
  <circle cx="256" cy="272" r="180" fill="url(#berryGrad)"/>

  <!-- Berry bloom (the dusty coating) -->
  <circle cx="256" cy="272" r="180" fill="white" opacity="0.06"/>

  <!-- Calyx (crown/star at top of blueberry) -->
  <g transform="translate(256,108)">
    <path d="M0,-12 L6,-2 L14,4 L6,2 L0,10 L-6,2 L-14,4 L-6,-2 Z" fill="#2d4a3e" opacity="0.9"/>
    <path d="M-18,2 Q-10,-8 0,-14 Q10,-8 18,2 Q10,0 0,4 Q-10,0 -18,2 Z" fill="#1d3a2e"/>
    <circle cx="0" cy="-2" r="6" fill="#0F6E56" opacity="0.4"/>
  </g>

  <!-- Checkmark -->
  <path d="M170,272 L232,334 L348,210"
        stroke="#0F6E56" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Subtle highlight -->
  <ellipse cx="210" cy="210" rx="60" ry="40" fill="white" opacity="0.04" transform="rotate(-30,210,210)"/>

  <defs>
    <radialGradient id="berryGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#3d2b5a"/>
      <stop offset="40%" stop-color="#2a1f45"/>
      <stop offset="100%" stop-color="#1a1a2e"/>
    </radialGradient>
  </defs>
</svg>
